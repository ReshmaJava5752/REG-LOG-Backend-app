# Server port configuration
server.port=8080

# MySQL Database Connection settings
# Connects to your existing 'registration_db'
# The JDBC URL and the user name are overridable so that a private connection string never has
# to be committed. The defaults below point at a local development instance only.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/registration_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
# Database password — set via DB_PASSWORD environment variable (placeholder default must be changed)
spring.datasource.password=${DB_PASSWORD:CHANGE_ME_IN_PRODUCTION}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate settings
# 'none' ensures Spring Boot will NEVER alter, drop, or recreate your existing tables
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT Security Settings (Set via JWT_SECRET environment variable — placeholder default must be changed)
app.jwt.secret=${JWT_SECRET:CHANGE_ME_IN_PRODUCTION_CHANGE_ME_IN_PRODUCTION}
app.jwt.expiration-ms=86400000

# OTP Recovery Settings
app.otp.expiry-minutes=5
app.otp.max-attempts=3
# Delivery mode for the reset OTP: 'smtp' (default) sends it by e-mail, 'console' prints it to
# the server log for local development only. Override without editing this file using
# the OTP_DELIVERY_MODE environment variable.
app.otp.delivery-mode=${OTP_DELIVERY_MODE:smtp}

# Secret used to fingerprint the password reset codes before they are stored.
# The database holds an HMAC-SHA256 fingerprint of the code, never the code itself.
# Without this secret the codes of pending requests could be brute forced from a
# database dump, because a 6 digit code has only one million possibilities.
# Defaults to the JWT secret, so setting JWT_SECRET is enough. Set OTP_HMAC_SECRET
# to give the reset codes a secret of their own.
app.otp.hmac-secret=${OTP_HMAC_SECRET:${JWT_SECRET:CHANGE_ME_IN_PRODUCTION_CHANGE_ME_IN_PRODUCTION}}

# Set to true to allow the console delivery mode to print the reset code to the
# server log. The code is never written to the log unless this is switched on
# explicitly, and the mode must never be enabled in a deployed environment.
app.otp.allow-console-logging=${OTP_ALLOW_CONSOLE_LOGGING:false}

# OTP Rate Limiting
# Protects the mailbox from being flooded and blunts account enumeration. Every limit is a
# fixed window: the first attempt opens the window and further attempts inside it count
# against the limit. Set a limit to 0 to switch that limit off.
# Requests for a password reset code, counted per account.
app.otp.rate-limit.request.max-per-window=5
app.otp.rate-limit.request.window-minutes=15
# Verification attempts, counted per account. Complements app.otp.max-attempts, which limits
# the attempts against a single code.
app.otp.rate-limit.verify.max-per-window=10
app.otp.rate-limit.verify.window-minutes=15
# Recovery calls, counted per client address. Limits account enumeration across identifiers.
app.otp.rate-limit.client.max-per-window=30
app.otp.rate-limit.client.window-minutes=15

# Persistent Session Settings
# Every successful login writes a row to the 'sessions' table so that a revoked token stays
# revoked across a backend restart. Only a SHA-256 fingerprint of the token is stored - the
# raw JWT is never written to the database.
# Requires the 'sessions' table: see database_backup/phase3_sessions_migration.sql
# (or fresh_install.sql for a brand-new database).
app.session.enabled=true
# Cron expression for removing expired session records (default: every hour at minute 0).
app.session.purge-cron=0 0 * * * *

# SMTP Mail Settings — Gmail (STARTTLS on port 587).
# Every credential is read from an environment variable; none of them live in this file.
# Set them before starting the backend (see .env.example and README.md):
#   SMTP_HOST, SMTP_PORT, SMTP_USERNAME, SMTP_PASSWORD, SMTP_FROM
# SMTP_USERNAME / SMTP_PASSWORD must be a Google account address and a Google App Password
# (not the regular account password).
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.protocol=${SMTP_PROTOCOL:smtp}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
# Sender address shown on the OTP mail. Falls back to SMTP_USERNAME when SMTP_FROM is not set.
spring.mail.from=${SMTP_FROM:${SMTP_USERNAME:}}
# Authenticate against the SMTP server (required by Gmail).
spring.mail.properties.mail.smtp.auth=true
# Encrypt the connection with STARTTLS (required by Gmail on port 587).
spring.mail.properties.mail.smtp.starttls.enable=true
# Fail the connection if STARTTLS cannot be negotiated, instead of falling back to plain text.
spring.mail.properties.mail.smtp.starttls.required=true
# Trust Gmail SMTP server and specify modern TLS protocols
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.properties.mail.smtp.ssl.protocols=TLSv1.2 TLSv1.3
# Fail fast instead of hanging when the SMTP server is unreachable.
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# Optional: load a local .env file (same directory as this file, or one level above) so the
# SMTP/DB/JWT settings can be kept outside of source control. Real environment variables always
# take precedence over the values in .env. See .env.example.
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]
